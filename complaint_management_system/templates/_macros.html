{% macro priority_badge(p) %}
<span class="pill pill-{{ p|lower }}">{{ p }}</span>
{% endmacro %}

{% macro status_badge(s) %}
<span class="pill pill-{{ s|lower|replace(' ','-') }}">{{ s }}</span>
{% endmacro %}

{# Time left (or overdue) for an active complaint. Prints nothing for finished ones. #}
{% macro sla_badge(c) -%}
{%- set s = c.sla -%}
{%- if s -%}
<span class="sla sla-{{ s.level }}"><i class="fas fa-{{ 'triangle-exclamation' if s.level == 'overdue' else 'hourglass-half' }}"></i> {{ s.text }}</span>
{%- endif -%}
{%- endmacro %}
